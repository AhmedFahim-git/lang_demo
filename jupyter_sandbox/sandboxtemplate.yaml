apiVersion: extensions.agents.x-k8s.io/v1beta1
kind: SandboxTemplate
metadata:
  # The test_client.py expects the template to have this name
  name: jupyter-template
  namespace: default
spec:
  networkPolicyManagement: Managed
  networkPolicy:
    ingress:
      - {}
    egress:
      - {}
  podTemplate:
    spec:
      # Optional: uncomment one of the lines below to enable sandbox isolation.
      runtimeClassName: gvisor # gVisor (see examples/quickstart/gvisor.md)
      # runtimeClassName: kata-qemu   # Kata Containers (see examples/quickstart/kata-containers.md)
      securityContext:
        runAsUser: 1000
        runAsGroup: 3000
        fsGroup: 2000
        runAsNonRoot: true
      containers:
        - name: python-runtime
          # The test_client.py expects the image to be agent-sandbox/examples/python-runtime-sandbox
          # image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/python-runtime-sandbox:latest-main
          image: fahim03/sandbox_image
          imagePullPolicy: IfNotPresent
          env:
            - name: BUCKET_MANAGE_SERVICE_HOSTNAME
              value: bucket-service
            - name: BUCKET_MANAGE_SERVICE_PORT
              value: "8000"
          ports:
            - containerPort: 8888
          readinessProbe:
            httpGet:
              path: "/"
              port: 8888
            initialDelaySeconds: 0
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: "/"
              port: 8888
            initialDelaySeconds: 2
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
              ephemeral-storage: "512Mi"
      restartPolicy: "OnFailure"
  # volumeClaimTemplatesPolicy: Overrides
  # volumeClaimTemplates:
